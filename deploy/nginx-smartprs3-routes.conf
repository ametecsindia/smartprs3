# SmartPRS 3 routes for nginx — included inside the smartprs.com server { } block
# (sudo cp deploy/nginx-smartprs3-routes.conf /etc/nginx/snippets/). Same routes as public/.htaccess.

client_max_body_size 25m;    # employee photos, documents, bulk uploads, .lic files

# The website at the bare root; "/?r=…" and every other address go to the application.
location = / {
    if ($args = "") { rewrite ^ /landing.php last; }
    rewrite ^ /app.php last;
}

# Machine-facing endpoints — same URLs as SmartPRS 2.
location ^~ /api/v1/     { rewrite ^ /v1.php last; }
location ^~ /api/mobile/ { rewrite ^ /mobile.php last; }
location ^~ /api/v3/     { rewrite ^ /api.php last; }
location ^~ /iclock/     { rewrite ^ /iclock.php last; }
location ^~ /update/     { rewrite ^ /update.php last; }

# People-facing doors.
location ~ ^/super/?$    { rewrite ^ /super.php last; }
location ~ ^/demo/?$     { rewrite ^ /demo.php last; }
location ~ ^/signup/?$   { rewrite ^ /signup.php last; }
location ~ ^/activate/?$ { rewrite ^ /activate.php last; }
location ~ ^/login/?$    { rewrite ^ /app.php?r=signin last; }
location ~ ^/c/[A-Za-z0-9]+/?$ { rewrite ^/c/([A-Za-z0-9]+)/?$ /app.php?r=signin&ws=$1 last; }
location ~ ^/(privacy-policy|terms-and-conditions|refund-policy|support-policy|data-protection|acceptable-use|grievance-redressal|disclaimer|licence-agreement|faqs)/?$ {
    rewrite ^/([a-z-]+)/?$ /policy.php?p=$1 last;
}
