# SmartPRS 3 on app.smartprs.com — nginx + PHP-FPM (Ubuntu 22.04/24.04).
# Copy to /etc/nginx/sites-available/app.smartprs.com, link into sites-enabled,
# `nginx -t && systemctl reload nginx`, then `certbot --nginx -d app.smartprs.com`.
# Same routes as public/.htaccess (Apache) and deploy/web.config (IIS).

server {
    listen 80;
    server_name app.smartprs.com;

    root /var/www/smartprs3/public;     # ONLY public/ is served: .env, storage/, keys stay outside
    index app.php;
    client_max_body_size 25m;           # employee photos, documents, bulk uploads, .lic files

    # Machine-facing endpoints — same URLs as SmartPRS 2.
    location ^~ /api/v1/     { try_files $uri /v1.php$is_args$args; }
    location ^~ /api/mobile/ { try_files $uri /mobile.php$is_args$args; }
    location ^~ /api/v3/     { try_files $uri /api.php$is_args$args; }
    location ^~ /iclock/     { try_files $uri /iclock.php$is_args$args; }
    location ^~ /update/     { try_files $uri /update.php$is_args$args; }

    # People-facing doors.
    location = /super    { try_files $uri /super.php$is_args$args; }
    location = /demo     { try_files $uri /demo.php$is_args$args; }
    location = /activate { try_files $uri /activate.php$is_args$args; }
    location = /login    { try_files $uri /app.php?r=signin&$args; }
    location ~ ^/c/([A-Za-z0-9]+)/?$ { try_files $uri /app.php?r=signin&ws=$1&$args; }

    location / { try_files $uri $uri/ /app.php$is_args$args; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;       # payroll close and biometric "Sync 31 days" can take a while
    }

    location ~ /\. { deny all; }        # never serve dot-files
}
